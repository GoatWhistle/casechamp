<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plexus | Изохроны</title>
<style>
{{BASE_CSS}}
.v1 .hero {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
  align-items: center;
  gap: clamp(32px, 4vw, 72px);
  min-height: var(--viewport);
  padding: clamp(48px, 6vw, 88px) var(--gutter) 64px;
}

.v1 .intro {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 24px;
  padding-inline-start: clamp(0px, 3.5vw, 64px);
}

.v1 .mark {
  position: relative;
  width: min(100%, 600px);
  margin-bottom: clamp(40px, 4.5vw, 72px);
}

.v1 .wm {
  position: absolute;
  overflow: visible;
  pointer-events: none;
}

.v1 .wm g {
  transform-box: fill-box;
  transform-origin: center;
}

.v1 .word {
  fill: var(--ink);
}

.v1 .atlas {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 0;
  padding: 16px 16px 20px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--paper-2);
}

.v1 .map {
  width: 100%;
  height: auto;
}

.v1 .legend {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 0 8px;
}

.v1 .legend ul {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px 28px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.v1 .legend li {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  font-size: 14px;
  line-height: 1.3;
}

.v1 .legend .ico {
  width: 18px;
  height: 18px;
  flex: none;
  color: var(--tone);
}

.v1 .legend .n {
  margin-left: auto;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

@media (max-width: 74.99rem) {
  .v1 .hero {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }

  .v1 .h1 {
    font-size: clamp(1.75rem, 1rem + 1.6vw, 2.25rem);
  }
}

@media (max-width: 63.99rem) {
  .v1 .hero {
    grid-template-columns: minmax(0, 1fr);
    padding-top: 72px;
  }

  .v1 .intro {
    padding-inline-start: 0;
  }
}

@media (max-width: 47.99rem) {
  .v1 .mark {
    width: calc(100% - 32px);
    margin: 16px 0 20px 16px;
  }

  .v1 .legend ul {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 16px;
  }

  .v1 .legend li {
    font-size: 13px;
  }

  .v1 .lead {
    font-size: 17px;
  }
}
</style>
</head>
<body>
<header class="hdr"></header>
<main class="v1">
  <section class="hero">
    <div class="intro">
      <div class="mark"><svg class="wm" role="img" aria-label="Plexus"></svg></div>
      <h1 class="h1">Какие сёла держатся на авиарейсах, зимниках и переправах</h1>
      <p class="lead">Атлас ручных связей России: рейсы, речные линии, зимники и переправы, которых нет в дорожном графе. У каждой связи есть источник, а где известно, сезон и частота.</p>
      <div class="actions">
        <a class="btn btn-primary" href="#" data-icon="map">Открыть карту</a>
        <a class="btn btn-quiet" href="#" data-icon="book">Методика</a>
      </div>
    </div>
    <figure class="atlas">
      <svg class="map" viewBox="24 36 952 548" aria-hidden="true"></svg>
      <figcaption class="legend">
        <ul></ul>
        <p class="fine"><span class="num">997</span> связей в <span class="num">82</span> регионах. Данные атласа на 8 ноября 2026 года.</p>
      </figcaption>
    </figure>
  </section>
</main>
<script>
{{BASE_JS}}{{WORDMARK}}{{ATLAS}}
const BRAND = ["var(--iso-1)", "var(--iso-2)", "var(--iso-3)"]
const GAP = 11
const STEP = 6.5
const LINE = 2.2

function buildMark() {
  const wm = document.querySelector(".v1 .wm")
  const mark = document.querySelector(".v1 .mark")
  const [x0, y0, x1, y1] = DATA.wordmark.wordBox
  const inner = GAP + STEP * 2 + LINE / 2
  const outer = GAP + STEP * 8 + LINE / 2
  const bw = x1 - x0 + inner * 2
  const bh = y1 - y0 + inner * 2
  const fw = x1 - x0 + outer * 2
  const fh = y1 - y0 + outer * 2
  const over = outer - inner
  wm.setAttribute("viewBox", `${x0 - outer} ${y0 - outer} ${fw} ${fh}`)
  mark.style.aspectRatio = `${bw} / ${bh}`
  Object.assign(wm.style, {
    left: `${(-over / bw) * 100}%`,
    top: `${(-over / bh) * 100}%`,
    width: `${(fw / bw) * 100}%`,
    height: `${(fh / bh) * 100}%`,
  })
  const wave = []
  for (let k = 8; k >= 3; k--) {
    const g = el("g", { "data-mode": MODES[k - 3].key }, wm)
    el("path", { d: DATA.wordmark.rings[k], "fill-rule": "evenodd", fill: "var(--tone)" }, g)
    wave.unshift(g)
  }
  const brand = []
  for (let k = 2; k >= 0; k--) {
    const g = el("g", {}, wm)
    el("path", { d: DATA.wordmark.rings[k], "fill-rule": "evenodd", fill: BRAND[k] }, g)
    brand.unshift(g)
  }
  const word = el("path", { class: "word", d: DATA.wordmark.word, "fill-rule": "evenodd" }, wm)
  return { word, brand, wave }
}

function buildLegend() {
  document.querySelector(".v1 .legend ul").innerHTML = MODES.map(
    (m) => `<li data-mode="${m.key}">${modeIcon(m.key)}<span>${m.label}</span><span class="n">${m.count}</span></li>`,
  ).join("")
}

mountIcons()
mountHeader()
buildLegend()
const mark = buildMark()
const map = drawMap(document.querySelector(".v1 .map"))

function play() {
  cancelAll(document.querySelector(".v1"))
  const out = ease("--ease-out")
  const quick = reduced.matches
  const opt = (duration, delay) => ({ duration: quick ? 160 : duration, delay: quick ? 0 : delay, easing: out, fill: "both" })
  mark.word.animate([{ opacity: 0, filter: "blur(2px)" }, { opacity: 1, filter: "blur(0)" }], opt(560, 0))
  mark.brand.forEach((g, i) => {
    g.animate([{ opacity: 0, transform: "scale(0.96)" }, { opacity: 1, transform: "none" }], opt(900, 260 + i * 130))
  })
  mark.wave.forEach((g, i) => {
    const start = 560 + i * 130
    if (quick) {
      g.animate([{ opacity: 0 }, { opacity: 0 }], { duration: 1, fill: "both" })
    } else {
      g.animate(
        [
          { opacity: 0, transform: "scale(0.99)", easing: out },
          { opacity: 1, transform: "scale(1)", offset: 0.22, easing: "linear" },
          { opacity: 0, transform: "scale(1.012)" },
        ],
        { duration: 1150, delay: start, fill: "both" },
      )
    }
    map.groups[MODES[i].key].animate([{ opacity: 0 }, { opacity: 1 }], opt(700, start + 180))
  })
}

whenReady(play)
mountReview("{{SLUG}}", play)
</script>
</body>
</html>
