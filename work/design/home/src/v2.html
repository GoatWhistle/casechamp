<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plexus | Сплетение</title>
<style>
{{BASE_CSS}}
.v2 {
  display: flex;
  flex-direction: column;
  min-height: var(--viewport);
  padding: clamp(32px, 4vw, 56px) var(--gutter) 40px;
  gap: clamp(28px, 3vw, 44px);
}

.v2 .stage {
  width: min(100%, calc((100svh - 520px) * 642 / 246), 1240px);
  min-width: min(100%, 560px);
}

.v2 .glyphs {
  width: 100%;
  height: auto;
  overflow: visible;
}

.v2 .glyphs path {
  fill: none;
  stroke: var(--tone);
  stroke-width: 22;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.v2 .glyphs .stop {
  fill: var(--paper);
  stroke: var(--tone);
  stroke-width: 6;
}

.v2 .glyphs .ripple {
  fill: none;
  stroke: var(--tone);
  stroke-width: 3;
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
}

.v2 .glyphs .hub {
  --tone: var(--ink);
}

.v2 .caps {
  display: grid;
  grid-template-columns: 18fr 80fr 34fr 44fr 34fr 80fr 34fr 80fr 34fr 80fr 34fr 72fr 18fr;
  margin-top: 20px;
}

.v2 .cap {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  padding-right: 12px;
}

.v2 .cap:nth-child(1) { grid-column: 2 / 4; }
.v2 .cap:nth-child(2) { grid-column: 4 / 6; }
.v2 .cap:nth-child(3) { grid-column: 6 / 8; }
.v2 .cap:nth-child(4) { grid-column: 8 / 10; }
.v2 .cap:nth-child(5) { grid-column: 10 / 12; }
.v2 .cap:nth-child(6) { grid-column: 12 / 14; }

.v2 .bar {
  position: relative;
  height: 6px;
  margin-bottom: 6px;
  border-radius: 3px;
  background: var(--paper-3);
  overflow: hidden;
}

.v2 .bar i {
  position: absolute;
  inset: 0 auto 0 0;
  width: calc(var(--share) * 100%);
  border-radius: 3px;
  background: var(--tone);
}

.v2 .label {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.25;
}

.v2 .count {
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
}

.v2 .about {
  display: grid;
  grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
  align-items: end;
  gap: 24px clamp(32px, 4vw, 72px);
  margin-top: auto;
  padding-top: clamp(24px, 3vw, 40px);
  border-top: 1px solid var(--line);
}

.v2 .about .h1 {
  max-width: 26ch;
}

.v2 .side {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

@media (max-width: 63.99rem) {
  .v2 .about {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (max-width: 47.99rem) {
  .v2 .stage {
    width: 100%;
    min-width: 0;
  }

  .v2 .caps {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px 20px;
    margin-top: 28px;
  }

  .v2 .cap:nth-child(n) {
    grid-column: auto;
  }

  .v2 .lead {
    font-size: 17px;
  }
}
</style>
</head>
<body>
<header class="hdr"></header>
<main class="v2">
  <section class="stage" aria-labelledby="title">
    <svg class="glyphs" viewBox="-18 -78 642 246" role="img" aria-label="Plexus: шесть букв, шесть видов связи"></svg>
    <div class="caps"></div>
  </section>
  <section class="about">
    <h1 class="h1" id="title">Какие сёла держатся на авиарейсах, зимниках и переправах</h1>
    <div class="side">
      <p class="lead">Шесть букв названия нарисованы шестью видами ручных связей, которых нет в дорожном графе. Всего их <span class="num">997</span> в <span class="num">82</span> регионах, у каждой есть источник.</p>
      <div class="actions">
        <a class="btn btn-primary" href="#" data-icon="map">Открыть карту</a>
        <a class="btn btn-quiet" href="#" data-icon="book">Методика</a>
      </div>
    </div>
  </section>
</main>
<script>
{{BASE_JS}}
const LETTERS = [
  { x: 0, d: ["M0 150V40A40 40 0 0 1 40 0A40 40 0 0 1 80 40V60A40 40 0 0 1 40 100H0"], from: [[0, 150]], to: [] },
  { x: 114, d: ["M0 -60V64A36 36 0 0 0 36 100H44"], from: [[0, -60]], to: [[44, 100]] },
  { x: 192, d: ["M0 50H80V40A40 40 0 0 0 40 0A40 40 0 0 0 0 40V60A40 40 0 0 0 40 100H78"], from: [], to: [[78, 100]] },
  { x: 306, d: ["M0 0L80 100", "M80 0L0 100"], from: [[0, 0], [80, 0]], to: [[80, 100], [0, 100]], hub: [40, 50] },
  { x: 420, d: ["M0 0V60A40 40 0 0 0 40 100A40 40 0 0 0 80 60V0"], from: [[0, 0]], to: [[80, 0]] },
  { x: 534, d: ["M72 0H25A25 25 0 0 0 25 50H47A25 25 0 0 1 47 100H0"], from: [[72, 0]], to: [[0, 100]] },
]

function stop(g, [x, y], r = 11) {
  const ring = el("circle", { class: "ripple", cx: x, cy: y, r }, g)
  const dot = el("circle", { class: "stop", cx: x, cy: y, r }, g)
  return { ring, dot }
}

function buildGlyphs() {
  const svg = document.querySelector(".v2 .glyphs")
  return LETTERS.map((L, i) => {
    const g = el("g", { "data-mode": MODES[i].key, transform: `translate(${L.x} 0)` }, svg)
    const lines = L.d.map((d) => el("path", { d, pathLength: 1, "stroke-dasharray": "1 2" }, g))
    const from = L.from.map((p) => stop(g, p))
    const to = L.to.map((p) => stop(g, p))
    let hub = null
    if (L.hub) {
      const h = el("g", { class: "hub" }, g)
      hub = stop(h, L.hub, 15)
    }
    return { lines, from, to, hub }
  })
}

function buildCaps() {
  const caps = document.querySelector(".v2 .caps")
  const max = Math.max(...MODES.map((m) => m.count))
  caps.innerHTML = MODES.map(
    (m) => `<div class="cap" data-mode="${m.key}">
      <span class="bar"><i style="--share:${(m.count / max).toFixed(3)}"></i></span>
      <span class="label">${m.label}</span>
      <span class="count">${m.count} ${m.count % 10 === 1 && m.count % 100 !== 11 ? "связь" : "связей"}</span>
    </div>`,
  ).join("")
  return [...caps.children]
}

mountIcons()
mountHeader()
const glyphs = buildGlyphs()
const caps = buildCaps()

function play() {
  cancelAll(document.querySelector(".v2"))
  const out = ease("--ease-out")
  const move = ease("--ease-in-out")
  const quick = reduced.matches
  const t = (ms) => (quick ? 0 : ms)
  const show = (node, delay, duration = 160) =>
    node.animate([{ opacity: 0 }, { opacity: 1 }], { duration: quick ? 160 : duration, delay: t(delay), easing: out, fill: "both" })
  const ripple = (node, delay) => {
    if (quick) return
    node.animate(
      [{ opacity: 0.7, transform: "scale(1)" }, { opacity: 0, transform: "scale(2.6)" }],
      { duration: 760, delay, easing: out, fill: "forwards" },
    )
  }
  glyphs.forEach((G, i) => {
    const start = 140 + i * 150
    const each = G.lines.length > 1 ? 520 : 660
    G.lines.forEach((line, k) => {
      const at = start + k * 150
      line.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1, delay: t(at), fill: "both" })
      line.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: quick ? 1 : each, delay: t(at), easing: move, fill: "both" })
    })
    const end = start + (G.lines.length - 1) * 150 + each
    G.from.forEach((s, k) => show(s.dot, start + k * 150))
    G.to.forEach((s) => {
      show(s.dot, end - 60)
      ripple(s.ring, end - 40)
    })
    if (G.hub) {
      show(G.hub.dot, end)
      ripple(G.hub.ring, end + 20)
    }
    const cap = caps[i]
    cap.animate(
      [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }],
      { duration: quick ? 160 : 320, delay: t(end - 80), easing: out, fill: "both" },
    )
    cap.querySelector("i").animate(
      [{ clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)" }],
      { duration: quick ? 1 : 560, delay: t(end), easing: out, fill: "both" },
    )
  })
}

whenReady(play)
mountReview("{{SLUG}}", play)
</script>
</body>
</html>
