[project]
name = "casechamp-a2"
version = "0.1.0"
description = "Кейс А2: индекс доступности рынков со стресс-тестом транспортной сети"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.2.2",  # ВМ без AVX: свежие сборки падают с SIGILL
    "numpy>=2.4.6",
    "osmium>=4.3.2",
    "pandas",
    "pyarrow>=26.0.1",
    "scipy>=1.17.1",
]

[dependency-groups]
traffic = [
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pyproj>=3.7.2",
    "shapely>=2.2.0",
]
