[project]
name = "plexus-traffic-model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "scipy>=1.17",
    "pyarrow>=26",
    "rasterio>=1.4",
    "shapely>=2",
    "numba>=0.67,<0.68",
    "osmium>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthetic_traffic"]
